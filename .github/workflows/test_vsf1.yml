name: Run VSF1 tests

on:
  push:
    branches:
      - petsies-theme
      - 'release/v**'
      - 'hotfix/v**'
  pull_request:
    branches:
      - petsies-theme
      - 'release/v**'
      - 'hotfix/v**'

jobs:
  prepare_dependencies:
    name: Prepare dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout Petsies theme
        run: git submodule update --init --recursive src/themes/petsies-capybara

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

  lint:
    name: Lint
    needs: prepare_dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout Petsies theme
        run: git submodule update --init --recursive src/themes/petsies-capybara

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ hashFiles('**/yarn.lock') }}

      - name: Verify upgrade configuration lifecycle
        run: yarn test:upgrade:config

      - name: Run linter
        run: yarn lint

  unit_tests:
    name: Maintained unit tests
    needs: prepare_dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout Petsies theme
        run: git submodule update --init --recursive src/themes/petsies-capybara

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ hashFiles('**/yarn.lock') }}

      - name: Run maintained project unit tests
        run: yarn test:unit:maintained

      - name: Run stock Vue Storefront core unit tests (disabled)
        if: ${{ false }}
        run: yarn test:unit:core

  build:
    name: Build
    needs: prepare_dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout Petsies theme
        run: git submodule update --init --recursive src/themes/petsies-capybara

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ hashFiles('**/yarn.lock') }}

      - name: Run build
        run: yarn build
