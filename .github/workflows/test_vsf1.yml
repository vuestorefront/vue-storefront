name: Run VSF1 tests

on:
  push:
    branches:
      - petsies-theme
      - bulkorders-theme
  pull_request:
    branches:
      - petsies-theme
      - bulkorders-theme

jobs:
  resolve_theme_matrix:
    name: Resolve theme matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Select theme branches
        id: resolve
        env:
          APP_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          case "$APP_BRANCH" in
            petsies-theme)
              echo 'matrix={"include":[{"theme_branch":"petsies-theme"},{"theme_branch":"budsies-theme"},{"theme_branch":"waggables-theme"}]}' >> "$GITHUB_OUTPUT"
              ;;
            bulkorders-theme)
              echo 'matrix={"include":[{"theme_branch":"bulkorders-theme"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported app branch: $APP_BRANCH" >&2
              exit 1
              ;;
          esac

  prepare_dependencies:
    name: Prepare dependencies (${{ matrix.theme_branch }})
    needs: resolve_theme_matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.resolve_theme_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout workspace submodules
        env:
          PAYMENT_BRAINTREE_BRANCH: optimuspro
          THEME_BRANCH: ${{ matrix.theme_branch }}
        run: |
          git submodule update --init src/modules/payment-braintree src/themes/petsies-capybara
          git -C src/modules/payment-braintree fetch origin "$PAYMENT_BRAINTREE_BRANCH"
          git -C src/modules/payment-braintree checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara fetch origin "$THEME_BRANCH"
          git -C src/themes/petsies-capybara checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara submodule update --init --recursive

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ matrix.theme_branch }}-${{ hashFiles('yarn.lock', 'src/modules/payment-braintree/package.json', 'src/themes/petsies-capybara/package.json') }}

      - name: Install dependencies
        run: yarn install --immutable

  lint:
    name: Lint (${{ matrix.theme_branch }})
    needs:
      - resolve_theme_matrix
      - prepare_dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.resolve_theme_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout workspace submodules
        env:
          PAYMENT_BRAINTREE_BRANCH: optimuspro
          THEME_BRANCH: ${{ matrix.theme_branch }}
        run: |
          git submodule update --init src/modules/payment-braintree src/themes/petsies-capybara
          git -C src/modules/payment-braintree fetch origin "$PAYMENT_BRAINTREE_BRANCH"
          git -C src/modules/payment-braintree checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara fetch origin "$THEME_BRANCH"
          git -C src/themes/petsies-capybara checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara submodule update --init --recursive

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ matrix.theme_branch }}-${{ hashFiles('yarn.lock', 'src/modules/payment-braintree/package.json', 'src/themes/petsies-capybara/package.json') }}

      - name: Verify upgrade configuration lifecycle
        run: yarn test:upgrade:config

      - name: Run linter
        run: yarn lint

  unit_tests:
    name: Maintained unit tests (${{ matrix.theme_branch }})
    needs:
      - resolve_theme_matrix
      - prepare_dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.resolve_theme_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout workspace submodules
        env:
          PAYMENT_BRAINTREE_BRANCH: optimuspro
          THEME_BRANCH: ${{ matrix.theme_branch }}
        run: |
          git submodule update --init src/modules/payment-braintree src/themes/petsies-capybara
          git -C src/modules/payment-braintree fetch origin "$PAYMENT_BRAINTREE_BRANCH"
          git -C src/modules/payment-braintree checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara fetch origin "$THEME_BRANCH"
          git -C src/themes/petsies-capybara checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara submodule update --init --recursive

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ matrix.theme_branch }}-${{ hashFiles('yarn.lock', 'src/modules/payment-braintree/package.json', 'src/themes/petsies-capybara/package.json') }}

      - name: Run maintained project unit tests
        run: yarn test:unit:maintained

      - name: Run stock Vue Storefront core unit tests (disabled)
        if: ${{ false }}
        run: yarn test:unit:core

  build:
    name: Build (${{ matrix.theme_branch }})
    needs:
      - resolve_theme_matrix
      - prepare_dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.resolve_theme_matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout workspace submodules
        env:
          PAYMENT_BRAINTREE_BRANCH: optimuspro
          THEME_BRANCH: ${{ matrix.theme_branch }}
        run: |
          git submodule update --init src/modules/payment-braintree src/themes/petsies-capybara
          git -C src/modules/payment-braintree fetch origin "$PAYMENT_BRAINTREE_BRANCH"
          git -C src/modules/payment-braintree checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara fetch origin "$THEME_BRANCH"
          git -C src/themes/petsies-capybara checkout --detach FETCH_HEAD
          git -C src/themes/petsies-capybara submodule update --init --recursive

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          test "$(yarn --version)" = "4.17.1"

      - name: Get cached dependencies
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-24.14.1-yarn-4.17.1-${{ matrix.theme_branch }}-${{ hashFiles('yarn.lock', 'src/modules/payment-braintree/package.json', 'src/themes/petsies-capybara/package.json') }}

      - name: Run build
        run: yarn build
