version: '2.0'
services:
  redis:
    image: 'redis:4-alpine'

  app:
    build:
      context: .
      dockerfile: docker/vue-storefront/Dockerfile
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    depends_on:
      - redis
    environment:
      - VS_ENV
      - APPVERSION
      - HELMET_ENABLED
      - HELMET_FRAME_ANCESTORS

      - NODEJS_INSTANCES_COUNT
      - NODEJS_INSTANCE_MAX_MEMORY
      - NODEJS_INSTANCE_MAX_OLD_SPACE
      - NODEJS_KEEP_ALIVE_TIMEOUT
      - PM2_WORKER_INTERVAL

      - SSR_OUTPUT_CACHE_ENABLE
      - SSR_OUTPUT_CACHE_TTL

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      - DEFAULT_STORE_ID
      - DEFAULT_STORE_CODE
      - DEFAULT_STORE_TITLE
      - DEFAULT_STORE_NAME
      - DEFAULT_STORE_DESCRIPTION
      - STORE_THEME
      - PRIVACY_POLICY_URL
      - PRIVACY_OPT_OUT_URL
      - POLARIS_ID
      - PETSIES_STORE_DOMAIN
      - BUDSIES_STORE_DOMAIN
      - BULKORDERS_STORE_DOMAIN
      - WAGGABLES_STORE_DOMAIN
      - STORYBLOK_HOME_STORY_SLUG

      - VSF_API_DOMAIN
      - MAGENTO_DOMAIN
      - CACHE_INVALIDATION_KEY
      - FILEUPLOADER_UPLOAD_URL
      - IMAGE_HANDLER_SERVICE_URL
      - QA_PHOTOS_HANDLER_SERVICE_URL
      - ERROR_LOGGING_SERVICE_URL

      - GTM_ID
      - GTM_SCRIPT_SOURCE

      - AFFIRM_PUBLIC_KEY
      - AFFIRM_CDN

      - AMAZONPAY_SANDBOX
      - AMAZONPAY_MERCHANT_ID
      - AMAZONPAY_STORE_ID

      - GOOGLE_PAY_MERCHANT_ID

      - FERA_API_PUBLIC_KEY
      - SHOW_PRODUCT_RATING

      - PLACES_API_PUBLIC_KEY

      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - .:/var/www
    networks:
      - default
      - reverseproxy
      # - vue-storefront-api
    expose:
      - 3000

  tests:
      build:
        context: .
        dockerfile: docker/tests/Dockerfile
      user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
      security_opt:
        - seccomp:unconfined
      environment:
        - SSH_AUTH_SOCK=/ssh-agent.sock
        - DEFAULT_STORE_DOMAIN
      volumes:
        - .:/var/www
        - ${SSH_AUTH_SOCK}:/ssh-agent.sock
        #- ~/.agents:/root/.agents
        - ~/.agents:/home/ubuntu/.agents
        #- ~/.codex:/root/.codex
        - ~/.codex:/home/ubuntu/.codex

networks:
  reverseproxy:
      name: webdevelopmentreverseproxy_default
      external: true
#  vue-storefront-api:
#    external:
#      name: vue-storefront-api_default
